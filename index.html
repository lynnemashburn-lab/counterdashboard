<title>Crown & Coin</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one-screen arcade cabinet. HUD on top, the machine fills the middle, boost tray and brass control deck at the bottom. */
:root{
  color-scheme:dark;
  --ink:#0d0818; --plum:#1d1233; --plum2:#2c1b4d; --plum3:#43297a;
  --brass:#e2b354; --brass-hi:#ffe19a; --brass-deep:#9c6b1e;
  --pink:#ff4fa3; --cyan:#4de3ff; --good:#63e37c; --text:#f6efe2; --muted:#a99cc4;
  --common:#9fb3c8; --rare:#4cc3ff; --epic:#c77dff; --legend:#ffc94a;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-weight:800;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--ink)}

/* HUD */
#hud{padding-block:6px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--plum2),var(--plum));border-bottom:3px solid var(--brass-deep);display:flex;flex-direction:column;gap:6px;z-index:3}
.hrow{display:flex;align-items:center;gap:8px}
#lvl{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--plum3),var(--plum));
  border:3px solid var(--brass);display:grid;place-items:center;font-family:var(--display);font-size:17px;color:var(--brass-hi)}
#xpwrap{flex:1;min-width:0}
#xpbar{height:12px;border-radius:8px;background:#0008;border:2px solid var(--plum3);overflow:hidden}
#xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .25s}
#xptxt{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:2px}
#gear{width:36px;height:36px;border-radius:10px;background:var(--plum3);border:2px solid var(--brass-deep);font-family:var(--display);font-size:12px;color:var(--brass-hi)}
#pills{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pill{display:flex;align-items:center;gap:3px;background:#0007;border:2px solid var(--plum3);border-radius:20px;padding:2px 5px 2px 2px;min-width:0}
.pill img{width:19px;height:19px;flex:none}
.pill b{font-family:var(--display);font-weight:400;font-size:13px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:clip;white-space:nowrap;flex:1;text-align:right}

/* Stage */
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.side{position:absolute;top:8px;display:flex;flex-direction:column;gap:7px;z-index:2}
.side.l{left:max(8px,env(safe-area-inset-left,0px))}.side.r{right:max(8px,env(safe-area-inset-right,0px));align-items:flex-end}
.sbtn{position:relative;min-width:58px;padding:6px 8px;border-radius:12px;font-family:var(--display);font-size:13px;letter-spacing:.3px;
  background:linear-gradient(var(--plum3),var(--plum2));border:2px solid var(--brass);box-shadow:0 3px 0 #000a;color:var(--brass-hi)}
.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000a}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid #fff}
#speed{display:flex;align-items:center;gap:4px;background:#000a;border:2px solid var(--brass);border-radius:12px;padding:3px 5px;font-family:var(--display);font-size:13px;color:var(--brass-hi)}
#speed button{width:24px;height:24px;border-radius:7px;background:var(--plum3);font-size:16px;line-height:1}
#speed small{font-family:var(--body);font-size:9px;color:var(--muted);display:block;line-height:1;text-transform:uppercase;letter-spacing:.6px}
#fxbar{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:6px;z-index:2;pointer-events:none}
#fxbar span{font-family:var(--display);font-size:13px;padding:3px 10px;border-radius:14px;background:#000b;border:2px solid var(--cyan);color:var(--cyan);white-space:nowrap}
#hint{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--display);font-size:17px;color:#fff;background:#000a;padding:8px 14px;border-radius:14px;
  border:2px solid var(--pink);pointer-events:none;white-space:nowrap;z-index:2;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}

/* Boost tray + deck */
#boosts{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding-block:6px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:#150c27;border-top:3px solid var(--brass-deep)}
.bst{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;border-radius:10px;background:var(--plum2);border:2px solid var(--plum3);font-size:10px;color:var(--muted)}
.bst img{width:30px;height:30px}
.bst i{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-style:normal;font-family:var(--display);font-size:12px;display:grid;place-items:center}
.bst.zero i{background:#555}
.bst:active{transform:scale(.94)}
#deck{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;gap:6px;align-items:end;padding-block:6px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(#150c27,#0a0613)}
.nav{position:relative;padding:9px 0 8px;border-radius:12px;font-family:var(--display);font-size:14px;background:linear-gradient(var(--plum3),var(--plum2));border:2px solid var(--brass-deep);box-shadow:0 3px 0 #000;color:var(--text)}
.nav:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
#insert{padding:7px 0 6px;border-radius:16px;font-family:var(--display);color:#3a2203;line-height:1.05;
  background:radial-gradient(circle at 50% 20%,var(--brass-hi),var(--brass) 55%,var(--brass-deep));border:3px solid #fff3;box-shadow:0 5px 0 #5c3d0c,0 0 18px #e2b35466}
#insert b{display:block;font-weight:400;font-size:17px}#insert span{font-family:var(--body);font-size:10px;font-weight:900;letter-spacing:.5px}
#insert:active{transform:translateY(3px);box-shadow:0 2px 0 #5c3d0c}
#insert.need{animation:need .5s 3}
@keyframes need{50%{box-shadow:0 5px 0 #5c3d0c,0 0 0 6px var(--pink)}}

/* Sheets */
.ovl{position:absolute;inset:0;z-index:10;background:#06030dcc;display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--plum);border-top:4px solid var(--brass);border-radius:22px 22px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(60px)}}
#shead{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
#shead h2{margin:0;flex:1;font-family:var(--display);font-weight:400;font-size:24px;color:var(--brass-hi);letter-spacing:.5px}
#sclose{width:36px;height:36px;border-radius:50%;background:var(--plum3);border:2px solid var(--brass-deep);font-family:var(--display);font-size:16px}
#stabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto}
#stabs button{flex:1;padding:7px 10px;border-radius:10px;background:var(--plum2);border:2px solid var(--plum3);font-size:13px;color:var(--muted);white-space:nowrap}
#stabs button.on{background:var(--plum3);border-color:var(--brass);color:var(--brass-hi)}
#sbody{overflow-y:auto;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.note{font-size:12px;color:var(--muted);line-height:1.35;margin:0}
.row{display:flex;align-items:center;gap:10px;background:var(--plum2);border:2px solid var(--plum3);border-radius:14px;padding:8px 10px}
.row>img{width:44px;height:44px;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-family:var(--display);font-weight:400;font-size:16px}
.rt span{font-size:12px;color:var(--muted);line-height:1.25}
.buy{flex:none;min-width:78px;padding:7px 10px;border-radius:12px;font-family:var(--display);font-size:15px;color:#0c3214;background:linear-gradient(#9cf5ab,var(--good));box-shadow:0 3px 0 #1f7a33;line-height:1.1}
.buy s{display:block;font-family:var(--body);font-size:10px;font-weight:800;color:#0c321499}
.buy.alt{color:#3a2203;background:linear-gradient(var(--brass-hi),var(--brass));box-shadow:0 3px 0 var(--brass-deep)}
.buy.off{background:#4a4360;color:#a99cc4;box-shadow:0 3px 0 #2a2440}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}
.buy img{width:15px;height:15px;vertical-align:-2px}
.pair{display:flex;gap:6px;flex:none}
.pair .buy{min-width:56px;font-size:13px;padding:6px 6px}
h3{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:17px;color:var(--cyan);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 small{font-family:var(--body);font-size:11px;color:var(--muted)}
.set{background:var(--plum2);border:2px solid var(--plum3);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1;border-radius:10px;background:#0006;border:2px solid var(--common);display:grid;place-items:center}
.slot img{width:84%;height:84%}
.slot.none img{filter:grayscale(1) brightness(.75);opacity:.28}
.slot em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-family:var(--display);font-size:11px;background:var(--ink);border:1px solid currentColor;border-radius:8px;padding:0 4px}

.bar{height:10px;border-radius:6px;background:#0008;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day{background:var(--plum2);border:2px solid var(--plum3);border-radius:12px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.day img{width:36px;height:36px}.day b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--text)}
.day.done{opacity:.45}.day.now{border-color:var(--brass);background:var(--plum3)}.day:last-child{grid-column:span 2}
.big{align-self:center;min-width:200px;padding:11px 18px;font-size:19px}
#wheelwrap{position:relative;width:min(280px,76vw);aspect-ratio:1;align-self:center;margin:6px 0}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--brass);box-shadow:0 0 24px #ff4fa366;transition:transform 4s cubic-bezier(.12,.7,.1,1)}
#wptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border:13px solid transparent;border-top:24px solid var(--pink);filter:drop-shadow(0 2px 0 #000)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}.stats span{color:var(--muted)}.stats b{font-family:var(--display);font-weight:400;text-align:right}

/* Reward reveal */
#rw{z-index:20;align-items:center;background:#06030de6}
#rwbox{width:calc(100% - 32px);max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
#rwbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--brass-hi);text-shadow:0 3px 0 #000}
#rwbox p{margin:0;color:var(--muted);font-size:13px}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.card{width:92px;padding:8px 4px;border-radius:14px;background:var(--plum2);border:3px solid var(--common);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;line-height:1.2;color:var(--text);
  animation:flip .45s cubic-bezier(.2,1.4,.4,1) backwards}
.card img{width:52px;height:52px}.card b{font-family:var(--display);font-weight:400;font-size:15px}
.card small{font-size:9px;letter-spacing:.8px;text-transform:uppercase}
@keyframes flip{from{transform:scale(.2) rotateY(90deg);opacity:0}}
.r0{border-color:var(--common);color:var(--common)}.r1{border-color:var(--rare);color:var(--rare)}.r2{border-color:var(--epic);color:var(--epic)}.r3{border-color:var(--legend);color:var(--legend)}
.card.r3{box-shadow:0 0 18px #ffc94a88}.card.r2{box-shadow:0 0 14px #c77dff66}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:30;background:#000d;border:2px solid var(--brass);border-radius:14px;padding:7px 14px;font-size:13px;max-width:86%;text-align:center;pointer-events:none;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){#hint,.card,#sheet{animation:none}#wheel{transition-duration:.6s}}
</style>

<div id="app">
  <header id="hud">
    <div class="hrow">
      <div id="lvl">1</div>
      <div id="xpwrap"><div id="xptxt"><span id="rank">Level 1</span><span id="xpnum"></span></div><div id="xpbar"><div id="xpfill"></div></div></div>
      <button id="gear" data-a="open:menu" aria-label="Menu">MENU</button>
    </div>
    <div id="pills">
      <button class="pill" data-a="open:shop:bank" aria-label="Coins"><img id="i-coins" alt=""><b id="n-coins">0</b></button>
      <button class="pill" data-a="open:shop:bank" aria-label="Gems"><img id="i-gems" alt=""><b id="n-gems">0</b></button>
      <button class="pill" data-a="open:shop:bank" aria-label="Bills"><img id="i-cash" alt=""><b id="n-cash">0</b></button>
      <button class="pill" data-a="open:shop:bank" aria-label="Tickets"><img id="i-tickets" alt=""><b id="n-tickets">0</b></button>
      <button class="pill" data-a="open:shop:bank" aria-label="Keys"><img id="i-keys" alt=""><b id="n-keys">0</b></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="side l">
      <button class="sbtn" data-a="open:daily">Daily<span class="dot" id="d-daily" hidden></span></button>
      <button class="sbtn" data-a="open:goals">Goals<span class="dot" id="d-goals" hidden></span></button>
      <button class="sbtn" data-a="open:upg">Upgrade</button>
    </div>
    <div class="side r">
      <div id="speed"><button data-a="speed:-1" aria-label="Slower">−</button><div style="text-align:center"><small>Speed</small><span id="spd">3</span></div><button data-a="speed:1" aria-label="Faster">+</button></div>
      <button class="sbtn" data-a="sound" id="snd">Sound on</button>
    </div>
    <div id="hint">Tap the machine to drop a coin</div>
    <div id="fxbar"></div>
  </main>
  <div id="boosts"></div>
  <nav id="deck">
    <button class="nav" data-a="open:shop:bank">Shop</button>
    <button class="nav" data-a="open:prizes">Prizes</button>
    <button id="insert" data-a="insert"><b>INSERT COIN</b><span id="insn">+10 FREE</span></button>
    <button class="nav" data-a="open:wheel">Wheel<span class="dot" id="d-wheel" hidden></span></button>
    <button class="nav" data-a="open:shop:crates">Crates</button>
  </nav>
  <div class="ovl" id="modal" hidden><div id="sheet"><div id="shead"><h2 id="stitle"></h2><button id="sclose" data-a="close" aria-label="Close">✕</button></div><div id="stabs"></div><div id="sbody"></div></div></div>
  <div class="ovl" id="rw" hidden><div id="rwbox"><h2 id="rwtitle"></h2><p id="rwsub"></p><div id="cards"></div><button class="buy alt big" data-a="rwok">Collect</button></div></div>
  <div id="toast" style="opacity:0"></div>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const wpick=ws=>{let t=0;for(const w of ws)t+=w;let r=Math.random()*t;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i}return ws.length-1};
const fmt=n=>{n=Math.floor(n+1e-6);if(n<10000)return n.toLocaleString('en-US');if(n<1e6)return(n/1e3).toFixed(n<1e5?1:0)+'K';if(n<1e9)return(n/1e6).toFixed(1)+'M';return(n/1e9).toFixed(1)+'B'};
const DISPLAY="'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif";

/* ---------- sprites (all art is drawn here, no image files) ---------- */
function mk(sz,fn){const c=document.createElement('canvas');c.width=c.height=sz;fn(c.getContext('2d'),sz);return c}
function shade(hex,a){const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a))));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function poly(g,pts,fill,stroke,lw){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||3;g.lineJoin='round';g.stroke()}}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function symCrown(g,r,col){const w=r*.86,h=r*.6,x=r-w/2,y=r-h/2;poly(g,[[x,y+h],[x,y+h*.12],[x+w*.26,y+h*.55],[x+w*.5,y],[x+w*.74,y+h*.55],[x+w,y+h*.12],[x+w,y+h]],col)}
function coinSprite(c1,c2,c3,symCol){return mk(96,(g,s)=>{const r=s/2;const gr=g.createRadialGradient(r*.7,r*.55,r*.1,r,r,r);gr.addColorStop(0,c1);gr.addColorStop(.7,c2);gr.addColorStop(1,c3);
  g.fillStyle=gr;g.beginPath();g.arc(r,r,r-1,0,7);g.fill();g.strokeStyle=c3;g.lineWidth=3;g.beginPath();g.arc(r,r,r*.76,0,7);g.stroke();
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.beginPath();g.arc(r,r,r*.86,3.5,5.1);g.stroke();symCrown(g,r,symCol)})}
const SYM={
  gem:(g,r)=>poly(g,[[r-.2*r,r-.38*r],[r+.2*r,r-.38*r],[r+.44*r,r-.1*r],[r,r+.46*r],[r-.44*r,r-.1*r]],'#fff'),
  cash:(g,r)=>{g.strokeStyle='#fff';g.lineWidth=5;rrect(g,r-.46*r,r-.27*r,.92*r,.54*r,4);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(r,r,.12*r,0,7);g.fill()},
  ticket:(g,r,d)=>{g.fillStyle='#fff';rrect(g,r-.48*r,r-.28*r,.96*r,.56*r,4);g.fill();g.fillStyle=d;g.beginPath();g.arc(r-.48*r,r,.11*r,0,7);g.arc(r+.48*r,r,.11*r,0,7);g.fill();g.fillRect(r+.14*r,r-.28*r,3,.56*r)},
  key:(g,r)=>{g.strokeStyle='#fff';g.lineWidth=6;g.beginPath();g.arc(r-.24*r,r,.17*r,0,7);g.stroke();g.fillStyle='#fff';g.fillRect(r-.06*r,r-3,.52*r,6);g.fillRect(r+.22*r,r,5,.2*r);g.fillRect(r+.38*r,r,5,.26*r)},
  rain:(g,r)=>{g.fillStyle='#fff';[[-.26,-.12],[.26,-.12],[0,.24]].forEach(p=>{g.beginPath();g.arc(r+p[0]*r,r+p[1]*r,.17*r,0,7);g.fill()})},
  shake:(g,r)=>{g.strokeStyle='#fff';g.lineWidth=6;g.lineJoin='round';g.beginPath();[[-.44,.1],[-.22,-.2],[0,.16],[.22,-.2],[.44,.1]].forEach((p,i)=>i?g.lineTo(r+p[0]*r,r+p[1]*r):g.moveTo(r+p[0]*r,r+p[1]*r));g.stroke()},
  walls:(g,r)=>{g.fillStyle='#fff';g.fillRect(r-.42*r,r-.36*r,.16*r,.72*r);g.fillRect(r+.26*r,r-.36*r,.16*r,.72*r);g.beginPath();g.arc(r,r+.08*r,.13*r,0,7);g.fill()},
  giant:(g,r)=>{g.strokeStyle='#fff';g.lineWidth=6;g.beginPath();g.arc(r,r,.36*r,0,7);g.stroke();symCrown(g,r*1,'#fff')},

    if(tab==='boosts')return BOOSTS.map(b=>`<div class="row"><img src="${IC['b_'+b[0]]}" alt=""><div class="rt"><b>${b[1]} <span style="font-family:var(--body);font-size:12px">· you have ${S.boosts[b[0]]}</span></b><span>${b[5]}</span></div><div class="pair"><button class="buy alt${S.gems<b[4]?' off':''}" data-a="bbuy:${b[0]}:1">×1<s>${b[4]} gems</s></button><button class="buy alt${S.gems<b[4]*4?' off':''}" data-a="bbuy:${b[0]}:5">×5<s>${b[4]*4} gems</s></button></div></div>`).join('');
    return`<div class="row"><img src="${IC.pass}" alt=""><div class="rt"><b>Royal Pass</b><span>2× payout on every coin and chip · coins refill 50% faster · INSERT COIN gives 20 · double daily bonus · your name in lights on the marquee</span></div></div>
      <button class="buy big ${S.vip?'off':''}" data-a="pass">${S.vip?'Pass is active':'<s>$9.99 / month</s>ACTIVATE FREE'}</button>`}},
  prizes:{title:'Prize Collections',body(){const own=Object.keys(S.prizes).filter(k=>S.prizes[k]>0).length;return`<p class="note">${own} of 30 prizes found. Push prizes off the front edge or pull them from crates. Trade in a full set for a big reward and a permanent +5% payout.</p>`+COLS.map(c=>{
    const have=c.items.filter((_,i)=>S.prizes[c.id+i]>0).length,t=S.tiers[c.id]||0;return`<div class="set"><h3>${c.name}<small>${t?'Set bonus +'+t*5+'% · ':''}${have}/5</small></h3><div class="slots">${c.items.map((it,i)=>{const n=S.prizes[c.id+i]||0;
      return`<div class="slot r${RAR[i]}${n?'':' none'}" title="${it[0]}"><img src="${PRIZE[c.id+i].url}" alt="${it[0]}">${n>1?`<em>×${n}</em>`:''}</div>`}).join('')}</div>
      ${have===5?`<button class="buy" data-a="set:${c.id}">Trade in set · ${ico('gems')} ${100*(t+1)} + Gold Crate</button>`:`<div class="bar"><i style="width:${have*20}%"></i></div>`}</div>`}).join('')}},
  daily:{title:'Daily Bonus',body(){const idx=dailyIndex(),ready=dailyReady();return`<p class="note">Come back each day to climb the week. Miss a day and the streak starts over at Day 1.${S.vip?' Royal Pass doubles every amount.':''}</p><div class="days">${DAILY.map((d,i)=>
    `<div class="day${i<idx||(!ready&&i===idx)?' done':''}${ready&&i===idx?' now':''}"><span>Day ${i+1}</span><img src="${rwIcon(d)}" alt=""><b>${rwText(d)}</b></div>`).join('')}</div>
    <button class="buy big${ready?'':' off'}" data-a="daily">${ready?'Claim Day '+(idx+1):'Claimed. Back tomorrow'}</button>`}},
  goals:{title:'Goals',body(){return`<p class="note">Three goals are always running. Claim one and a new goal takes its place.</p>`+S.goals.map((q,i)=>{const G=GOALS.find(x=>x[0]===q.k),done=q.have>=q.n;
    return`<div class="row"><div class="rt"><b>${G[1].replace('{n}',q.n)}</b><div class="bar"><i style="width:${q.have/q.n*100}%"></i></div><span>${fmt(q.have)} / ${q.n} · ${ico('gems',13)} ${q.gems} ${ico('tickets',13)} ${q.tickets}</span></div><button class="buy${done?'':' off'}" data-a="goal:${i}">${done?'Claim':'Going'}</button></div>`}).join('')}},
  upg:{title:'Upgrades',body(){return`<p class="note">Permanent upgrades, paid for in bills. Current payout: ×${mult().toFixed(2)} per coin.</p>`+UPG.map(u=>{const l=S.up[u[0]],c=Math.round(u[3]*Math.pow(1.6,l)),max=l>=10;
    return`<div class="row"><div class="rt"><b>${u[1]} <span style="font-family:var(--body);font-size:12px">· Lv ${l}/10</span></b><span>${u[2]}</span><div class="bar"><i style="width:${l*10}%"></i></div></div><button class="buy alt${max||S.cash<c?' off':''}" data-a="upg:${u[0]}">${max?'MAX':ico('cash')+' '+fmt(c)}</button></div>`}).join('')}},
  wheel:{title:'Prize Wheel',body(){return`<div id="wheelwrap"><canvas id="wheel" width="560" height="560"></canvas><div id="wptr"></div></div>
    <button class="buy big" data-a="spin:free" id="wfree"></button><button class="buy alt big${S.tickets<10?' off':''}" data-a="spin:tix">Spin · ${ico('tickets')} 10</button>`},after(){drawWheel();wheelLabel()}},
  menu:{title:'Menu',body(){const s=S.stats;return`<div class="stats"><span>Coins dropped</span><b>${fmt(s.dropped)}</b><span>Coins won</span><b>${fmt(s.won)}</b><span>Lost down the sides</span><b>${fmt(s.lost)}</b><span>Prizes won</span><b>${fmt(s.prizes)}</b>
    <span>Crates opened</span><b>${fmt(s.crates)}</b><span>Wheel spins</span><b>${fmt(s.spins)}</b><span>Best combo</span><b>×${s.best}</b><span>Payout multiplier</span><b>×${mult().toFixed(2)}</b></div>
    <div class="row"><div class="rt"><b>Sound</b><span>Coin clinks and jingles</span></div><button class="buy alt" data-a="sound">${S.sound?'On':'Off'}</button></div>
    <div class="row"><div class="rt"><b>Refill the bed</b><span>Clears the machine and lays out a fresh bed of coins</span></div><button class="buy alt" data-a="rebed">Refill</button></div>
    <div class="row"><div class="rt"><b>Erase everything</b><span>Wipes coins, prizes and progress on this device</span></div><button class="buy off" data-a="reset" id="resetb">Erase</button></div>
    <p class="note">Progress saves on this device, in this browser. No money, no ads, no accounts.</p>`}}
};
function openM(kind,tab){M={kind,tab:tab||(VIEW[kind].tabs?VIEW[kind].tabs[0][0]:null)};$('#modal').hidden=false;renderM(true)}
function renderM(resetScroll){if(!M)return;const V=VIEW[M.kind],b=$('#sbody'),sc=b.scrollTop;$('#stitle').textContent=V.title;$('#stabs').hidden=!V.tabs;
  $('#stabs').innerHTML=V.tabs?V.tabs.map(t=>`<button class="${t[0]===M.tab?'on':''}" data-a="tab:${t[0]}">${t[1]}</button>`).join(''):'';b.innerHTML=V.body(M.tab);b.scrollTop=resetScroll?0:sc;if(V.after)V.after()}
let wheelRot=0,spinning=false;
function drawWheel(){const c=$('#wheel');if(!c)return;const w=c.getContext('2d'),n=WHEEL.length,a=Math.PI*2/n;w.translate(280,280);for(let i=0;i<n;i++){w.beginPath();w.moveTo(0,0);w.arc(0,0,280,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);w.closePath();w.fillStyle=WHEEL[i][3];w.fill();w.strokeStyle='#1d1233';w.lineWidth=5;w.stroke();
    w.save();w.rotate(-Math.PI/2+(i+.5)*a);w.fillStyle=i===7?'#3a2203':'#fff';w.font=`34px ${DISPLAY}`;w.textAlign='right';w.textBaseline='middle';w.fillText(WHEEL[i][0],262,0);w.restore()}
  w.fillStyle='#e2b354';w.beginPath();w.arc(0,0,36,0,7);w.fill();w.fillStyle='#1d1233';w.beginPath();w.arc(0,0,22,0,7);w.fill();c.style.transition='none';c.style.transform=`rotate(${wheelRot}deg)`;void c.offsetWidth;c.style.transition=''}
function wheelLabel(){const b=$('#wfree');if(!b)return;const left=S.wheelAt-Date.now();if(left<=0){b.textContent='Free spin';b.classList.remove('off')}else{const s=Math.ceil(left/1000);b.textContent='Free spin in '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');b.classList.add('off')}}
function spin(kind){if(spinning)return;if(kind==='free'){if(Date.now()<S.wheelAt){sfx.no();return}S.wheelAt=Date.now()+WHEEL_CD}else{if(S.tickets<10){sfx.no();toast('Need 10 tickets. The Bank has free rolls.');return}S.tickets-=10}
  spinning=true;dirty=true;S.stats.spins++;bump('spin',1);badges();wheelLabel();const i=wpick(WHEEL.map(w=>w[2])),seg=360/WHEEL.length,target=360-(i+.5)*seg+rnd(-seg*.35,seg*.35);
  wheelRot=Math.ceil(wheelRot/360)*360+360*5+target;const c=$('#wheel');if(c)c.style.transform=`rotate(${wheelRot}deg)`;for(let k=0;k<22;k++)beep(900,.03,'square',.03,k*k*.008);
  setTimeout(()=>{spinning=false;const r=WHEEL[i][1];let cards=give(r);if(r.crate)cards=cards.concat(openCrate(r.crate,true));reveal(i===7?'JACKPOT!':'Wheel win',WHEEL[i][0],cards);if(M&&M.kind==='wheel')renderM()},4150)}
let resetArm=0;
const ACT={
  open(k,t){openM(k,t)},close(){M=null;$('#modal').hidden=true},tab(t){M.tab=t;renderM(true)},rwok(){nextReveal()},
  insert(){S.coins+=S.vip?20:10;dirty=true;sfx.insert();if(!S.played)toast('Coins loaded. Tap the machine to drop them.')},
  speed(d){S.speed=Math.max(1,Math.min(5,S.speed+ +d));dirty=true},sound(){S.sound=!S.sound;dirty=true;if(S.sound)sfx.buy();renderM()},
  boost(id){useBoost(id)},
  pack(i){const p=PACKS[i];S[p[0]]+=p[1];dirty=true;sfx.buy();toast('+'+fmt(p[1])+' '+UNIT[p[0]]+' added. No charge.');renderM()},
  crate(k){const C=CRATES[k];if(k==='vault'){if(S.keys<3){sfx.no();toast('The Vault takes 3 keys. Key Rings are free in the Bank.');return}S.keys-=3}else{if(S.gems<C.cost){sfx.no();toast('Need '+(C.cost-S.gems)+' more gems. Gem packs are free in the Bank.');return}S.gems-=C.cost}openCrate(k);renderM()},
  bbuy(id,n){n=+n;const b=BOOSTS.find(x=>x[0]===id),c=n===5?b[4]*4:b[4];if(S.gems<c){sfx.no();toast('Need '+(c-S.gems)+' more gems. Gem packs are free in the Bank.');return}S.gems-=c;S.boosts[id]+=n;dirty=true;sfx.buy();renderBoosts();renderM()},
  pass(){if(S.vip)return;S.vip=true;dirty=true;sfx.lvl();reveal('Royal Pass','Active for good. No renewal, no charge.',give({gems:200,keys:3,boost:{frenzy:3}}));renderM()},
  set(id){const c=COLS.find(x=>x.id===id);if(!c.items.every((_,i)=>S.prizes[id+i]>0))return;c.items.forEach((_,i)=>S.prizes[id+i]--);const t=(S.tiers[id]||0)+1;S.tiers[id]=t;let cards=give({gems:100*t,cash:1000*t,tickets:25});cards=cards.concat(openCrate('gold',true));
    reveal(c.name+' complete!','Permanent payout bonus is now +'+tiersTotal()*5+'%.',cards);renderM()},
  daily(){if(!dailyReady()){sfx.no();return}const idx=dailyIndex(),d=Object.assign({},DAILY[idx]);S.daily.streak=S.daily.last===yesterday()?S.daily.streak+1:0;S.daily.last=today();
    if(S.vip)for(const k in UNIT)if(d[k])d[k]*=2;let cards=give(d);if(d.crate)cards=cards.concat(openCrate(d.crate,true));reveal('Day '+(idx+1)+' bonus','Streak: '+(S.daily.streak+1)+' day'+(S.daily.streak?'s':''),cards);badges();renderM()},
  goal(i){const q=S.goals[i];if(!q||q.have<q.n){sfx.no();return}S.goals.splice(i,1);S.goals.push(newGoal());reveal('Goal complete','',give({gems:q.gems,tickets:q.tickets,xp:30}));badges();renderM()},
  upg(id){const u=UPG.find(x=>x[0]===id),l=S.up[id],c=Math.round(u[3]*Math.pow(1.6,l));if(l>=10)return;if(S.cash<c){sfx.no();toast('Need '+fmt(c-S.cash)+' more bills. Bill packs are free in the Bank.');return}S.cash-=c;S.up[id]++;dirty=true;sfx.buy();renderM()},
  spin(k){spin(k)},
  rebed(){seedBed();toast('Fresh bed of coins laid out.');ACT.close()},
  reset(){const b=$('#resetb');if(Date.now()-resetArm>4000){resetArm=Date.now();b.textContent='Tap again';b.classList.remove('off');return}S=fresh();while(S.goals.length<3)S.goals.push(newGoal());seedBed();frenzyT=wallsT=0;dirty=true;renderBoosts();badges();$('#hint').hidden=false;ACT.close();save();toast('Everything erased. Fresh cabinet.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el){const p=el.dataset.a.split(':');ACT[p[0]](p[1],p[2]);return}if(e.target.id==='modal')ACT.close()});
let holding=false,holdX=0,holdT=0;
const toX=e=>{const r=cv.getBoundingClientRect(),s=F/(D0+L-(WALL+R+4));return(e.clientX-r.left-cx)/s};
cv.addEventListener('pointerdown',e=>{e.preventDefault();holding=true;holdX=toX(e);holdT=0;tryDrop(holdX);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(holding)holdX=toX(e)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>holding=false));
window.addEventListener('resize',resize);

/* ---------- loop ---------- */
let last=0,acc=0,regenAcc=0,saveT=0,uiT=0;
function frame(t){requestAnimationFrame(frame);let dt=Math.min(.05,(t-last)/1000||0);last=t;tsec+=dt;acc+=dt;let n=0;while(acc>=1/60&&n<3){step(1/60);acc-=1/60;n++}if(acc>.1)acc=0;
  if(holding){holdT+=dt;if(holdT>.17){holdT=0;tryDrop(holdX+rnd(-2,2))}}
  if(S.coins<cap()){regenAcc+=dt;const rt=regenTime();if(regenAcc>=rt){regenAcc-=rt;S.coins+=1;dirty=true}}
  for(const p of pops){p.life-=dt;p.y-=38*dt}pops=pops.filter(p=>p.life>0);for(const p of parts){p.life-=dt;p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.life>0);
  draw();if(dirty)hud();uiT+=dt;if(uiT>.25){uiT=0;fx()}saveT+=dt;if(saveT>4){saveT=0;save()}}
function start(){buildSprites();resize();loadBed();while(S.goals.length<3)S.goals.push(newGoal());
  const away=(Date.now()-S.seen)/1000;if(S.played&&away>60&&S.coins<cap()){const add=Math.min(cap()-Math.floor(S.coins),Math.floor(away/regenTime()));if(add>0){S.coins+=add;setTimeout(()=>toast('While you were away the hopper refilled: +'+add+' coins'),600)}}
  if(S.played)$('#hint').hidden=true;renderBoosts();hud();badges();setInterval(()=>{badges();wheelLabel()},1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
  if(dailyReady()&&S.played)openM('daily');requestAnimationFrame(frame)}
const fontReady=document.fonts&&document.fonts.load?document.fonts.load("20px 'Lilita One'"):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,1500))]).then(start,start);
})();
</script>
